# Netlify config — builds the React/Vite frontend and proxies /api to Render.
# Backend: https://commission-backend-0d4h.onrender.com
#
# NOTE: Netlify's /api proxy times out at ~26s. Long operations (generate, sync, audit)
# must call Render directly — set VITE_API_BASE_URL in Netlify env vars.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# 1) API proxy — MUST come before the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "https://commission-backend-0d4h.onrender.com/api/:splat"
  status = 200
  force = true

# 2) SPA fallback (single-page app: every other path serves index.html).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
