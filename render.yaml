# Render Blueprint — FastAPI backend for the Big Battery Commission system.
# Database: Supabase Postgres via DATABASE_URL (no Render disk required).
services:
  - type: web
    name: commission-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Supabase Postgres connection string (set value in Render dashboard):
      - key: DATABASE_URL
        sync: false
      # Supabase Auth (JWT validation on /api/*)
      - key: SUPABASE_URL
        value: "https://evgmeszyxjzrrbrzznhv.supabase.co"
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Comma-separated Netlify/custom origins for direct browser → Render API calls
      - key: ALLOWED_ORIGINS
        value: "https://bigbatterycommission.netlify.app,https://bb-bice-three.vercel.app"
      # Optional: historical Excel root if mounted elsewhere
      - key: COMMISSIONS_ROOT
        sync: false
      # Zoho credentials — set values in the Render dashboard:
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ORGANIZATION_ID
        sync: false
      - key: ZOHO_ACCOUNTS_DOMAIN
        sync: false
      - key: ZOHO_API_DOMAIN
        sync: false
      - key: ZOHO_ACCOUNTS_BASE_URL
        sync: false
      - key: ZOHO_BOOKS_BASE_URL
        sync: false
